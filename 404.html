<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>404 - Page Not Found | Saksham Shekher</title>
    <meta name="description" content="The page you are looking for does not exist or has been moved.">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0b;
            --bg-elevated: #141416;
            --fg: #fafafa;
            --fg-muted: #a1a1aa;
            --fg-subtle: #71717a;
            --accent: #34d399;
            --accent-dim: #1e7a4f;
            --accent-glow: rgba(52, 211, 153, 0.35);
            --border: #27272a;
            --border-hover: #3f3f46;
            --card: #18181b;
            --focus: #34d399;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fafafa;
                --bg-elevated: #ffffff;
                --fg: #09090b;
                --fg-muted: #52525b;
                --fg-subtle: #71717a;
                --accent: #059669;
                --accent-dim: #047857;
                --accent-glow: rgba(5, 150, 105, 0.25);
                --border: #e4e4e7;
                --border-hover: #d4d4d8;
                --card: #ffffff;
                --focus: #059669;
            }
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            margin: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Skip link */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 1rem;
            z-index: 1000;
            padding: 0.75rem 1rem;
            background: var(--accent);
            color: var(--bg);
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: 6px;
            text-decoration: none;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 1rem;
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* Background atmosphere */
        .bg-atmosphere {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-atmosphere::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.15;
            animation: breathe 8s ease-in-out infinite;
        }

        .bg-atmosphere::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, var(--accent) 50%, transparent),
                radial-gradient(1px 1px at 80% 70%, var(--accent) 50%, transparent),
                radial-gradient(1px 1px at 40% 80%, var(--accent) 50%, transparent),
                radial-gradient(1.5px 1.5px at 90% 20%, var(--accent) 50%, transparent),
                radial-gradient(1px 1px at 60% 10%, var(--accent) 50%, transparent);
            background-repeat: no-repeat;
            opacity: 0.08;
            animation: twinkle 20s linear infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.12; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.18; }
        }

        @keyframes twinkle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.08; }
            25% { opacity: 0.12; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.06; }
            75% { opacity: 0.1; }
            100% { transform: translateY(0) rotate(360deg); opacity: 0.08; }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float-particle 15s ease-in-out infinite;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            40% { opacity: 0.4; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Main content */
        .page-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            text-align: center;
        }

        .content-card {
            width: 100%;
            max-width: none;
            padding: 4rem 2rem;
            background: linear-gradient(180deg, var(--card) 0%, var(--bg-elevated) 100%);
            border: none;
            border-radius: 0;
            box-shadow: none;
            animation: card-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes card-enter {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Illustration */
        .illustration {
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
            animation: illustration-float 6s ease-in-out infinite;
        }

        @keyframes illustration-float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        .illustration svg {
            width: 100%;
            height: 100%;
        }

        /* Typography */
        .error-code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--fg) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradient-shift 4s ease-in-out infinite;
            margin-bottom: 0.25rem;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .error-title {
            font-size: clamp(1.25rem, 3vw, 1.5rem);
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .error-message {
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 400;
            color: var(--fg-muted);
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto 2rem;
        }

        /* CTA Button */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 3px;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .btn:hover {
            background: var(--accent-dim);
            border-color: var(--accent-dim);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke-width: 2.5;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .illustration,
            .bg-atmosphere::before,
            .bg-atmosphere::after,
            .particle {
                animation: none !important;
            }
            .illustration { transform: none; }
            .bg-atmosphere::before { transform: translate(-50%, -50%); }
            .error-code { animation: none; background-position: 0% 50%; }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .content-card {
                padding: 2.5rem 1.25rem;
            }
            .illustration { width: 140px; height: 140px; }
            .btn {
                width: 100%;
                padding: 0.75rem 1.25rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="bg-atmosphere" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true" id="particles"></div>

    <main id="main-content" class="page-wrapper" role="main">
        <article class="content-card">
            <div class="illustration" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
                    <!-- Lost astronaut / explorer character -->
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
                        </linearGradient>
                        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#2a2a2e"/>
                            <stop offset="50%" stop-color="#1a1a1d"/>
                            <stop offset="100%" stop-color="#0f0f10"/>
                        </linearGradient>
                    </defs>

                    <!-- Ground shadow -->
                    <ellipse cx="100" cy="175" rx="45" ry="6" fill="#000" opacity="0.15"/>

                    <!-- Character body -->
                    <g transform="translate(100, 100)">
                        <!-- Backpack -->
                        <path d="M-50 -30 L-50 10 Q-55 25 -40 25 L-40 30 L-55 30 L-55 -30 Z" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>

                        <!-- Main body -->
                        <path d="M-35 -50 L-35 35 Q-35 45 -25 45 L25 45 Q35 45 35 35 L35 -50 Q35 -60 25 -60 L-25 -60 Q-35 -60 -35 -50 Z" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>

                        <!-- Arms -->
                        <g stroke="#2a2a2e" stroke-width="14" stroke-linecap="round">
                            <path d="M-35 -30 Q-55 -20 -65 5" stroke-linejoin="round"/>
                            <path d="M35 -30 Q55 -20 65 5" stroke-linejoin="round"/>
                        </g>
                        <g stroke="#3f3f46" stroke-width="12" stroke-linecap="round">
                            <path d="M-35 -30 Q-55 -20 -65 5" stroke-linejoin="round"/>
                            <path d="M35 -30 Q55 -20 65 5" stroke-linejoin="round"/>
                        </g>

                        <!-- Gloves -->
                        <circle cx="-65" cy="5" r="14" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>
                        <circle cx="65" cy="5" r="14" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>

                        <!-- Helmet -->
                        <path d="M-40 -60 Q-40 -85 0 -95 Q40 -85 40 -60 L40 -50 Q40 -70 0 -82 Q-40 -70 -40 -50 Z" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>

                        <!-- Visor -->
                        <path d="M-32 -62 Q-32 -80 0 -88 Q32 -80 32 -62 L32 -54 Q32 -68 0 -78 Q-32 -68 -32 -54 Z" fill="url(#visorGrad)" stroke="#34d399" stroke-width="1" filter="url(#glow)">
                            <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
                                M-32 -62 Q-32 -80 0 -88 Q32 -80 32 -62 L32 -54 Q32 -68 0 -78 Q-32 -68 -32 -54 Z;
                                M-32 -62 Q-32 -78 0 -86 Q32 -78 32 -62 L32 -54 Q32 -66 0 -76 Q-32 -66 -32 -54 Z;
                                M-32 -62 Q-32 -80 0 -88 Q32 -80 32 -62 L32 -54 Q32 -68 0 -78 Q-32 -68 -32 -54 Z
                            "/>
                        </path>

                        <!-- Helmet details -->
                        <circle cx="0" cy="-95" r="4" fill="#3f3f46"/>
                        <circle cx="0" cy="-95" r="2" fill="#34d399">
                            <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/>
                        </circle>

                        <!-- Side vents -->
                        <rect x="-42" y="-30" width="5" height="20" rx="2" fill="#1a1a1d" stroke="#3f3f46" stroke-width="1"/>
                        <rect x="37" y="-30" width="5" height="20" rx="2" fill="#1a1a1d" stroke="#3f3f46" stroke-width="1"/>

                        <!-- Chest panel -->
                        <rect x="-18" y="-20" width="36" height="30" rx="4" fill="#0f0f10" stroke="#3f3f46" stroke-width="1"/>
                        <circle cx="0" cy="-5" r="6" fill="#1a1a1d" stroke="#3f3f46" stroke-width="1">
                            <animate attributeName="r" dur="1.5s" repeatCount="indefinite" values="6;7;6"/>
                        </circle>
                        <circle cx="0" cy="-5" r="3" fill="#34d399" opacity="0.8">
                            <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0.8;1;0.8"/>
                        </circle>

                        <!-- Legs -->
                        <g stroke="#2a2a2e" stroke-width="16" stroke-linecap="round">
                            <path d="M-15 35 L-15 65"/>
                            <path d="M15 35 L15 65"/>
                        </g>
                        <g stroke="#3f3f46" stroke-width="12" stroke-linecap="round">
                            <path d="M-15 35 L-15 65"/>
                            <path d="M15 35 L15 65"/>
                        </g>

                        <!-- Boots -->
                        <path d="M-25 65 L-25 72 Q-25 78 -18 78 L-8 78 Q-2 78 -2 72 L-2 65 Z" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>
                        <path d="M25 65 L25 72 Q25 78 18 78 L8 78 Q2 78 2 72 L2 65 Z" fill="url(#suitGrad)" stroke="#3f3f46" stroke-width="1.5"/>

                        <!-- Floating sparkles around character -->
                        <g class="sparkles">
                            <circle cx="-70" cy="-40" r="2" fill="#34d399" opacity="0">
                                <animate attributeName="opacity" dur="3s" repeatCount="indefinite" begin="0s" values="0;1;0"/>
                                <animate attributeName="r" dur="3s" repeatCount="indefinite" begin="0s" values="0;3;0"/>
                                <animate attributeName="cy" dur="3s" repeatCount="indefinite" begin="0s" values="-40;-55;-40"/>
                            </circle>
                            <circle cx="70" cy="-40" r="2" fill="#34d399" opacity="0">
                                <animate attributeName="opacity" dur="3s" repeatCount="indefinite" begin="1s" values="0;1;0"/>
                                <animate attributeName="r" dur="3s" repeatCount="indefinite" begin="1s" values="0;3;0"/>
                                <animate attributeName="cy" dur="3s" repeatCount="indefinite" begin="1s" values="-40;-55;-40"/>
                            </circle>
                            <circle cx="-70" cy="30" r="1.5" fill="#34d399" opacity="0">
                                <animate attributeName="opacity" dur="4s" repeatCount="indefinite" begin="0.5s" values="0;1;0"/>
                                <animate attributeName="r" dur="4s" repeatCount="indefinite" begin="0.5s" values="0;2.5;0"/>
                                <animate attributeName="cy" dur="4s" repeatCount="indefinite" begin="0.5s" values="30;15;30"/>
                            </circle>
                            <circle cx="70" cy="30" r="1.5" fill="#34d399" opacity="0">
                                <animate attributeName="opacity" dur="4s" repeatCount="indefinite" begin="2s" values="0;1;0"/>
                                <animate attributeName="r" dur="4s" repeatCount="indefinite" begin="2s" values="0;2.5;0"/>
                                <animate attributeName="cy" dur="4s" repeatCount="indefinite" begin="2s" values="30;15;30"/>
                            </circle>
                        </g>

                        <!-- "404" floating near character -->
                        <text x="0" y="-115" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#34d399" opacity="0.9" filter="url(#glow)">
                            404
                            <animate attributeName="y" dur="3s" repeatCount="indefinite" values="-115;-122;-115"/>
                            <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.9;0.6;0.9"/>
                        </text>
                    </g>
                </svg>
            </div>

            <div class="error-code" aria-hidden="true">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">The page you're looking for doesn't exist or has been moved. Don't worry, even explorers get lost sometimes.</p>

            <div class="cta-group">
                <a href="/" class="btn btn-primary" aria-label="Return to Saksham Shekher homepage">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>Return Home</span>
                </a>
            </div>
        </article>
    </main>

    <script>
        // Generate floating particles
        (function() {
            const particlesContainer = document.getElementById('particles');
            if (!particlesContainer) return;

            // Respect reduced motion
            const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReduced) return;

            const particleCount = 12;
            const colors = ['#34d399', '#10b981', '#6ee7b7', '#a7f3d0'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (12 + Math.random() * 8) + 's';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = particle.style.height = (2 + Math.random() * 4) + 'px';
                particle.style.opacity = '0';
                particlesContainer.appendChild(particle);
            }
        })();

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;
                const target = document.querySelector(targetId);
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    target.focus({ preventScroll: true });
                }
            });
        });
    </script>
</body>
</html>
